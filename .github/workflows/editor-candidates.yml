name: Editor candidates
on:
  push:
    branches: [js/dev, dev, staging, master]
    paths:
      - tooling/vscode-extensions/**
      - .github/workflows/editor-candidates.yml
      - workflows/editor.candidate/**
  workflow_dispatch:
  pull_request:
    paths: ['tooling/vscode-extensions/**', '.github/workflows/editor-candidates.yml', 'workflows/editor.candidate/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Bootstrap pinned DockPipe
        run: bash .github/scripts/bootstrap-dockpipe.sh
      - name: Validate and package editors
        id: candidate
        run: |
          dockpipe --workflow-file workflows/check/config.yml
          dockpipe --workflow-file workflows/editor.candidate/config.yml
          printf 'artifacts=%s\n' "$(dockpipe scope workflow editor.candidate editors)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-candidates
          path: ${{ steps.candidate.outputs.artifacts }}
          if-no-files-found: error
