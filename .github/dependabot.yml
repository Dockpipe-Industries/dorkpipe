# Version update pull requests target dev.
# Native Dependabot security updates use the repository default branch.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /tooling/vscode-extensions/dockpipe-language-support
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /tooling/vscode-extensions/pipeon
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /packages/dorkpipe/resolvers/dorkpipe/assets/compose
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
