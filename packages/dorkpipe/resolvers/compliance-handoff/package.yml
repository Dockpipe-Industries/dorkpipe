schema: 1
kind: resolver
name: compliance-handoff
version: 0.6.5
min_dockpipe_version: 0.6.17
author: Dockpipe
license: Apache-2.0
repository: https://github.com/Dockpipe-Industries/dorkpipe
namespace: dockpipeproject
allow_clone: true
distribution: source
title: Compliance review handoff
description: Prepare a structured handoff for review from the selected DorkPipe evidence. Does not certify
  compliance.
catalog_type: workflow
categories:
- documentation
- security
platforms:
- windows
- deb
- macos
dependencies:
  host:
  - id: bash
    command: bash
    description: Required to run the packaged compliance handoff script. On macOS, use Homebrew Bash 4.2+
      on PATH.
    install:
      windows: winget install Git.Git
      deb: sudo apt-get update && sudo apt-get install -y bash
      macos: brew install bash
requires_resolvers:
- dorkpipe
