schema: 1
kind: resolver
name: user-insight-process
version: 0.6.5
min_dockpipe_version: 0.6.17
author: Dockpipe
license: Apache-2.0
repository: https://github.com/Dockpipe-Industries/dorkpipe
namespace: dockpipeproject
allow_clone: true
distribution: source
title: Process user feedback
description: Process recorded user feedback and export the results by category.
catalog_type: workflow
categories:
- documentation
platforms:
- windows
- deb
- macos
dependencies:
  host:
  - id: bash
    command: bash
    description: Required to run the packaged user-insight scripts. On macOS, use Homebrew Bash 4.2+ on
      PATH.
    install:
      windows: winget install Git.Git
      deb: sudo apt-get update && sudo apt-get install -y bash
      macos: brew install bash
requires_resolvers:
- dorkpipe
